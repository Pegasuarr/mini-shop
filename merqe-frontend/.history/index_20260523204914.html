<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MINI MERQE — Adult Style for Little Ones</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.383.0/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">MINI<span>MERQE</span></div>
  <nav>
    <button class="active" data-view="shop">
      <i data-lucide="store"></i> Shop
    </button>
    <button data-view="cart">
      <i data-lucide="shopping-bag"></i> Cart
    </button>
    <button data-view="orders">
      <i data-lucide="package"></i> Orders
    </button>
  </nav>
  <button class="cart-btn" data-view="cart">
    <i data-lucide="shopping-cart"></i> Cart
    <span class="cart-count" id="cart-count">0</span>
  </button>
</header>

<!-- ══════════════════════════════════════════
     SHOP VIEW
══════════════════════════════════════════ -->
<div id="view-shop" class="view active">

  <!-- HERO -->
  <div class="hero">
    <div class="hero-text">
      <div class="hero-label">✨ new collection 2026 ✨</div>
      <h1>Adult style <br>for the <span>little ones</span></h1>
      <p>See the styles in your child's face photos to see what they look like.</p>
      <div class="hero-actions">
        <button class="hero-btn-primary" id="learnMoreBtn">Learn more</button>
        <button class="hero-btn-secondary" id="contactBtn">Contact us</button>
      </div>
    </div>

    <div class="hero-img">
      <img
        src="images/hero.jpg"
        alt="Mini Merqe collection"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"
      >
      <!-- shown when hero.jpg is missing -->
      <div class="hero-img-fallback">
        <i data-lucide="image"></i>
        <span>Add <strong>images/hero.jpg</strong></span>
      </div>
    </div>

  </div>

  <div class="section-label">Categories</div>
  <div class="categories" id="categories-bar"></div>

  <div class="section-label">Mini collection · special offers</div>

  <div class="products-grid" id="products-grid"></div>

</div>

<!-- card view -->
<div id="view-cart" class="view">
  <h2><i data-lucide="shopping-bag"></i> Your Cart</h2>
  <div id="cart-body"></div>
</div>

<!-- ══════════════════════════════════════════
     ORDERS VIEW
══════════════════════════════════════════ -->
<div id="view-orders" class="view">
  <h2><i data-lucide="package"></i> Orders</h2>
  <div id="orders-body"></div>
</div>

<!-- ══════════════════════════════════════════
     CHECKOUT MODAL
══════════════════════════════════════════ -->
<div id="checkout-modal" style="display:none">
  <div class="modal-overlay">
    <div class="modal">
      <h3><i data-lucide="credit-card"></i> Checkout</h3>
      <div class="form-group">
        <label>Full name</label>
        <input type="text" id="f-name" placeholder="Jane Doe">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="f-email" placeholder="hello@example.com">
      </div>
      <div class="form-group">
        <label>Address</label>
        <input type="text" id="f-address" placeholder="123 Maple Street">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="closeModalBtn">Cancel</button>
        <button class="btn-confirm" id="placeOrderBtn">
          <i data-lucide="check"></i> Place Order
        </button>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
