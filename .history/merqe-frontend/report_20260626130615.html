<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 Daily Purchase Report</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.383.0/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="report-container" style="max-width:1400px;margin:0 auto;padding:20px 30px;">
    <header style="display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--border);margin-bottom:30px;">
      <div class="logo">MINI<span>MERQE</span></div>
      <button onclick="window.location.href='index.html'" class="btn-secondary" style="padding:8px 20px;border-radius:40px;border:1px solid var(--border);background:none;cursor:pointer;">
        <i data-lucide="arrow-left"></i> Back to Shop
      </button>
    </header>
    
    <div id="report-body">
      <!-- Report content will be loaded here -->
    </div>
  </div>
  <script src="app.js"></script>
  <script>
    // Load report on page load
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof loadReport === 'function') {
        loadReport();
      }
    });
  </script>
</body>
</html>
